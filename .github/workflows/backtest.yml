# Yahoo 전용 백테스트를 GHA 러너에서 직접 실행 (2026-08-02 대표 지적 "왜 EC2에서 하냐").
#
# 실행 장소 규칙:
#   - 여기(GHA 러너, 2코어·7GB): Yahoo 일봉만 쓰는 모드 전부 — pit1010(+wide)·fullmar·decade·
#     slots·tune·usprobe·idea:seasonal/monthpat/pairprem·**us:\*(41차 미장 랩 — 미장 시세는
#     KRX Open API 밖이라 전량 Yahoo다)** 등. 사업 서버 무접촉·메모리 여유.
#   - EC2(awning-ops deploy-investing.yml): 국내 IP·키움 키가 필요한 것만 — pityear(KRX)·
#     probe:flow·backfill:flow(키움 수급)·모의투자 데몬.
#   - 랭킹 수집과 재검증은 **분리돼 있다**: EC2 MODE=pityear가 KRX 실측 랭킹을
#     public/data/krx-pit/universe.json에 저장·커밋하고, 여기서 MODE=idea:krxpit이 그 파일을
#     읽어 야후 시세로 승자 3종을 재검증한다(KRX 접속 불필요 · 워크플로 수정 불요).
# 시크릿 불필요(Yahoo 공개 엔드포인트). 데이터 커밋 없음(읽기 전용 실행) —
# **예외: MODE=presets** 만 산출물(public/data/presets-precomputed.json)을 이 리포에 커밋한다.

name: Backtest (GHA runner)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'MODE (예: pit1010 / idea:seasonal — idea: 접두면 idea-lab.mjs / short:all — short: 접두면 shortterm-lab.mjs / overfit:overfit — overfit: 접두면 overfit-lab.mjs(과최적화 채점, 네트워크 불필요) / value:all — value: 접두면 value-lab.mjs(밸류·퀄리티 18변형, 시세·재무는 커밋된 정본·야후는 벤치만) / plateau:plateau — plateau: 접두면 plateau-lab.mjs(39차 고원 격자 405셀 · 시세는 KRX 커밋 정본·야후는 벤치·벽만 · plateau:quick 축소판 / plateau:offline 네트워크 불필요 / plateau:selftest 합성) / us:all — us: 접두면 us-lab.mjs(41차 미장 탐색 48변형: 27차 재현 8 + 다섯 계열 분위 격자 40 · 시세는 전량 야후 · us:xsmom 재현+모멘텀 분위 16 / us:quantile 계열 분위 40 / us:quick 스모크 4 / us:selftest 합성·네트워크 불필요) / dokkaebi:all — dokkaebi: 접두면 dokkaebi-lab.mjs(42차 유튜브 댓글 이평선 돌파 매매법 재측정 36변형: 기준이평 MA2·MA5 × 유니버스 40·80 × 진입필터 9종 · 시세는 KRX 커밋 정본·야후는 벤치(KODEX 200)만 · dokkaebi:ma2 MA2 축 18 / dokkaebi:quick 스모크 4 / dokkaebi:selftest 합성·네트워크 불필요) / lev:real — lev: 접두면 us-leverage-lab.mjs(43차 동적 레버리지 사다리 QQQ→QLD→TQQQ 12변형: 밴드 10·15·20·25% × 복귀버퍼 0·3·5%p · 시세는 tiingo 4종목 · lev:real 실측 구간 판정 / lev:synth 닷컴·금융위기 합성 스트레스(참고) / lev:dca 매일 1만원 적립식 QQQ·QLD·TQQQ(IRR·수중일) / lev:sweep 10~30 축별 훑기(진입밴드·익절방아쇠·익절규모 각 21 + 전면격자) / lev:prop 비중 분할 사다리(대표 지시 정본 · 밴드10|20 · +10%마다 10% 익절 래칫 · 18변형) / lev:all 전부 / lev:selftest 합성·네트워크 불필요) / presets = 프리셋 사전계산+커밋)'
        type: string
        required: true
      grid:
        description: 'PIT_GRID (pit1010에서 wide 지정 시 400조합)'
        type: string
        default: ''
      universe:
        description: 'US_UNIVERSE (us:* 전용 — real=커밋된 실측 PIT 목록 / 80 / 20. 비우면 80)'
        type: string
        default: ''
      price_source:
        description: 'US_PRICE_SOURCE (us:* 전용 — tiingo=상폐 포함 / yahoo. 비우면 yahoo)'
        type: string
        default: ''

concurrency: backtest-runner

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # MODE=presets 만 산출물을 push한다. 나머지 모드는 예전처럼 읽기 전용으로 돌고,
    # 이 권한을 쓰지 않는다(실행 경로 자체는 바뀌지 않았다).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 백테스트 실행
        if: inputs.mode != 'presets'
        # 시크릿은 **ussrc:* (미장 소스 실사)에서만** 쓴다. 나머지 모드는 야후 공개
        # 엔드포인트라 값이 비어 있어도 그대로 돈다(빈 값이면 loadSecret가 "없음"으로
        # 판정하고 그 소스를 skipped로 센다 — 조용히 통과시키지 않는다).
        #
        # ⚠️ 시크릿 단일 원본은 Doppler(investing-ops/prd)다. 여기 있는 것은 **사본**이고
        #    그 이유는 하나뿐이다: GHA 러너에는 investing-ops Doppler 토큰이 없고,
        #    AI 세션엔 그 토큰을 주지 않는다(SECRETS-POLICY). EC2를 쓰지 않기로 한
        #    2026-08-04 대표 지시에 따라 남은 유일한 경로다. 값이 바뀌면 **두 곳 다** 고쳐야
        #    한다 — Doppler가 먼저고 여기가 따라간다.
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          RAW="${{ inputs.mode }}"
          SCRIPT="spec-backtest.mjs"; RUN_MODE="$RAW"
          case "$RAW" in
            idea:*) SCRIPT="idea-lab.mjs"; RUN_MODE="${RAW#idea:}";;
            short:*) SCRIPT="shortterm-lab.mjs"; RUN_MODE="${RAW#short:}";;
            overfit:*) SCRIPT="overfit-lab.mjs"; RUN_MODE="${RAW#overfit:}";;
            value:*) SCRIPT="value-lab.mjs"; RUN_MODE="${RAW#value:}";;
            plateau:*) SCRIPT="plateau-lab.mjs"; RUN_MODE="${RAW#plateau:}";;
            # `dokkaebi:`는 다른 접두와 겹치지 않는다(`us:` 함정과 다르다) — 위치 의존성 없음.
            dokkaebi:*) SCRIPT="dokkaebi-lab.mjs"; RUN_MODE="${RAW#dokkaebi:}";;
            # `lev:`는 다른 접두와 겹치지 않는다 — 위치 의존성 없음.
            # 종목 4개(QQQ·QLD·TQQQ·SPY)만 부르므로 tiingo 무료 한도와 무관하다.
            lev:*) SCRIPT="us-leverage-lab.mjs"; RUN_MODE="${RAW#lev:}";;
            # `uspit:`를 `us:`보다 **위에** 둔다 — case는 위에서부터 매칭이라 순서가 뒤바뀌면
            # `us:*`가 `uspit:collect`를 삼켜 us-lab이 MODE=pit:collect로 돈다(조용한 오작동).
            uspit:*) SCRIPT="us-pit-collect.mjs"; RUN_MODE="${RAW#uspit:}";;
            # `ussrc:`도 `us:`보다 **위**에 둔다 — 아래 두면 `us:*`가 `ussrc:free`를 삼켜
            # us-lab이 MODE=src:free로 도는 조용한 오작동이 난다(uspit에서 겪은 그 함정).
            ussrc:*) SCRIPT="us-source-probe.mjs"; RUN_MODE="${RAW#ussrc:}";;
            us:*) SCRIPT="us-lab.mjs"; RUN_MODE="${RAW#us:}";;
          esac
          [ -n "${{ inputs.grid }}" ] && export PIT_GRID="${{ inputs.grid }}"
          # us-lab 축 2개. 비우면 러너 기본값(80 · yahoo)이라 41차 수치와의 연속성이 유지된다.
          # 값 검증은 러너가 한다(pickPriceSource·pickUniverse가 모르는 값이면 던진다) —
          # 여기서 조용히 기본값으로 갈아끼우지 않는다.
          [ -n "${{ inputs.universe }}" ] && export US_UNIVERSE="${{ inputs.universe }}"
          [ -n "${{ inputs.price_source }}" ] && export US_PRICE_SOURCE="${{ inputs.price_source }}"
          env MODE="$RUN_MODE" NODE_OPTIONS=--max-old-space-size=4096 node "scripts/$SCRIPT"

      # ---- uspit:* — 실측 PIT 유니버스 산출물 커밋 ----
      # 수집기가 전량 실패하면 스스로 exit 1 하므로 여기까지 오지 않는다(빈 파일 커밋 방지).
      - name: 미장 실측 유니버스 커밋
        if: startsWith(inputs.mode, 'uspit:')
        run: |
          set -eu
          DIR=public/data/us-pit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet`는 추적되지 않는 파일을 못 본다 — status --porcelain이 신규·수정 둘 다 잡는다.
          if [ -z "$(git status --porcelain -- "$DIR")" ]; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git add "$DIR"
          git commit -m "data(us-pit): 미장 실측 PIT 유니버스 수집 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ---- MODE=presets — 프리셋 사전계산 (화면 로딩 시간 단축용 산출물) ----
      - name: 프리셋 사전계산
        if: inputs.mode == 'presets'
        run: env NODE_OPTIONS=--max-old-space-size=4096 node scripts/preset-precompute.mjs
      - name: 산출물 커밋
        if: inputs.mode == 'presets'
        run: |
          set -eu
          FILE=public/data/presets-precomputed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` 는 **추적되지 않는 파일을 못 본다** — 첫 실행에서 산출물이
          # 조용히 커밋되지 않는다. status --porcelain 은 신규·수정 둘 다 잡는다.
          if [ -z "$(git status --porcelain -- "$FILE")" ]; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git add "$FILE"
          git commit -m "chore(presets): 프리셋 사전계산 결과 갱신 [skip ci]"
          # 그사이 다른 커밋이 올라왔을 수 있다 — rebase로 얹고 실행한 브랜치에 그대로 push.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
