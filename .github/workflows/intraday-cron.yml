# 국장 5분봉 누적 수집 크론 (2026-07-30 대표 지시로 가동)
#
# 왜: Yahoo v8 chart는 5분봉을 최근 60일치만 준다. 매일 받아 쌓지 않으면
#     영원히 60일이고, 쌓으면 시간이 데이터를 늘려 준다(6개월 뒤 6개월치).
#     장중 전략 백테스트(2차 검증)의 선행 조건.
#
# 언제: 평일 KST 16:15 (= 07:15 UTC) — 15:30 장 마감 후 확정 봉 수집.
#       GitHub Actions 스케줄은 default 브랜치(main)에서만 돌므로,
#       이 파일이 main에 머지된 뒤부터 활성화된다. workflow_dispatch로 수동 검증 가능.
#
# 경계: 공개 시세 조회만. 브로커 API·주문·자격증명 없음(규칙 2 무관 영역).
#       시크릿 불필요 — Yahoo는 무키. GITHUB_TOKEN은 데이터 커밋용 기본 토큰.

name: intraday-5m-cron

on:
  schedule:
    - cron: '15 7 * * 1-5' # 평일 07:15 UTC = 16:15 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-cron
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 의존성 불필요 — 스크립트는 Node 내장 fetch만 쓴다
      - name: 5분봉 수집 (누적 병합)
        run: node scripts/fetch-intraday.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "intraday-cron"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/intraday-5m.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: 5분봉 누적 $(date -u +%Y-%m-%d) (자동 수집)"
            git push origin main
          fi
